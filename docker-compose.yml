services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neighborhood_quality}
      POSTGRES_USER: ${POSTGRES_USER:-nqs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nqs_user} -d ${POSTGRES_DB:-neighborhood_quality}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
